services:
  app:
    build: .
    ports:
      - "${APP_PORT:-12048}:12048"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    extra_hosts:
      - "host.docker.internal:host-gateway"   # agar container bisa menjangkau Ollama di komputer Anda
    command: >
      sh -c "mkdir -p database && touch database/database.sqlite
      && composer install --no-interaction --prefer-dist
      && php artisan migrate --force
      && php artisan serve --host=0.0.0.0 --port=12048"

volumes:
  vendor:
